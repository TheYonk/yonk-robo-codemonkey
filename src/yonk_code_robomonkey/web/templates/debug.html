{% extends "base.html" %}

{% block title %}Debug - RoboMonkey{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-slate-100">Debug &amp; Monitoring</h2>
        <div class="flex items-center gap-3 text-sm">
            <span id="last-updated" class="text-slate-500"></span>
            <button id="refresh-toggle" onclick="toggleAutoRefresh()" class="px-2 py-1 bg-emerald-900/50 text-emerald-400 rounded text-xs border border-emerald-700">
                Auto-refresh: ON
            </button>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- LOGS PANEL                                                         -->
    <!-- ================================================================== -->
    <div class="bg-slate-800 border border-slate-700 shadow-lg rounded-lg p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-slate-100">Logs</h3>
            <div class="flex items-center gap-2">
                <!-- Tab buttons -->
                <button id="tab-daemon" onclick="switchLogTab('daemon')"
                        class="px-3 py-1 rounded text-xs font-medium bg-blue-900/50 text-blue-400 border border-blue-700">
                    Daemon
                </button>
                <button id="tab-web" onclick="switchLogTab('web')"
                        class="px-3 py-1 rounded text-xs font-medium bg-slate-700 text-slate-400 border border-slate-600">
                    Web
                </button>
                <span class="text-slate-600 mx-1">|</span>
                <!-- Lines selector -->
                <select id="log-lines" onchange="loadLogs()" class="text-xs bg-slate-700 border border-slate-600 rounded px-2 py-1 text-slate-200">
                    <option value="50">50 lines</option>
                    <option value="100" selected>100 lines</option>
                    <option value="200">200 lines</option>
                    <option value="500">500 lines</option>
                </select>
            </div>
        </div>
        <!-- Log meta -->
        <div id="log-meta" class="text-xs text-slate-500 mb-2"></div>
        <!-- Log content -->
        <div class="relative">
            <pre id="log-content" class="bg-slate-950 text-slate-300 text-xs font-mono p-4 rounded overflow-auto max-h-[28rem] whitespace-pre-wrap break-all">Loading...</pre>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- PROGRESS PANEL                                                     -->
    <!-- ================================================================== -->
    <div class="bg-slate-800 border border-slate-700 shadow-lg rounded-lg p-6">
        <h3 class="text-lg font-semibold text-slate-100 mb-4">Indexing &amp; Embedding Progress</h3>
        <div id="progress-content">
            <p class="text-slate-400">Loading...</p>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- JOBS PANEL                                                         -->
    <!-- ================================================================== -->
    <div class="bg-slate-800 border border-slate-700 shadow-lg rounded-lg p-6">
        <h3 class="text-lg font-semibold text-slate-100 mb-4">Job Queue</h3>
        <!-- Summary badges -->
        <div id="jobs-badges" class="flex gap-3 mb-4">
            <span class="text-xs text-slate-500">Loading...</span>
        </div>
        <!-- Running + Pending + Failed tables -->
        <div id="jobs-content"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── State ────────────────────────────────────────────────────────────────
let refreshInterval = null;
const REFRESH_MS = 10000;
let activeLogTab = 'daemon';

// Snapshot history for ETA calculation:  { repoName: [ {ts, chunks_embedded, docs_embedded, file_summaries, symbol_summaries} ] }
const progressHistory = {};
const MAX_HISTORY = 60; // keep last 60 snapshots (~10 min at 10s interval)

// ── Helpers ──────────────────────────────────────────────────────────────
function fmt(n) {
    if (n === null || n === undefined) return '--';
    return Number(n).toLocaleString();
}

function pct(current, total) {
    if (!total) return 0;
    return Math.min(current / total * 100, 100);
}

function fmtPct(current, total) {
    return pct(current, total).toFixed(1) + '%';
}

function calcRate(history, metric) {
    if (history.length < 2) return 0;
    // Use ~60s window
    const now = Date.now();
    const windowStart = now - 60000;
    let recent = history.filter(s => s.ts >= windowStart);
    if (recent.length < 2) recent = history.slice(-2);
    const first = recent[0], last = recent[recent.length - 1];
    const elapsedMin = (last.ts - first.ts) / 60000;
    if (elapsedMin < 0.05) return 0;
    return (last[metric] - first[metric]) / elapsedMin;
}

function calcEta(current, total, rate) {
    if (rate <= 0 || current >= total) return current >= total ? 'Complete' : 'N/A';
    const mins = (total - current) / rate;
    if (mins < 60) return Math.round(mins) + 'm';
    if (mins < 1440) return (mins / 60).toFixed(1) + 'h';
    return (mins / 1440).toFixed(1) + 'd';
}

function fmtRelative(isoDate) {
    if (!isoDate) return 'N/A';
    const diffMs = Date.now() - new Date(isoDate).getTime();
    const m = Math.floor(diffMs / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(diffMs / 3600000);
    if (h < 24) return h + 'h ago';
    return Math.floor(diffMs / 86400000) + 'd ago';
}

function fmtBytes(bytes) {
    if (!bytes) return '0 B';
    if (bytes > 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
    if (bytes > 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return bytes + ' B';
}

// ── Auto-refresh ─────────────────────────────────────────────────────────
function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(loadAll, REFRESH_MS);
}
function stopAutoRefresh() {
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
}
function toggleAutoRefresh() {
    const btn = document.getElementById('refresh-toggle');
    if (refreshInterval) {
        stopAutoRefresh();
        btn.textContent = 'Auto-refresh: OFF';
        btn.className = 'px-2 py-1 bg-slate-700 text-slate-400 rounded text-xs border border-slate-600';
    } else {
        startAutoRefresh();
        btn.textContent = 'Auto-refresh: ON';
        btn.className = 'px-2 py-1 bg-emerald-900/50 text-emerald-400 rounded text-xs border border-emerald-700';
    }
}

// ── Load everything ──────────────────────────────────────────────────────
async function loadAll() {
    await Promise.all([loadLogs(), loadProgress(), loadJobs()]);
    document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
}

document.addEventListener('DOMContentLoaded', () => {
    loadAll();
    startAutoRefresh();
});

// ── LOGS ─────────────────────────────────────────────────────────────────
function switchLogTab(tab) {
    activeLogTab = tab;
    document.getElementById('tab-daemon').className = tab === 'daemon'
        ? 'px-3 py-1 rounded text-xs font-medium bg-blue-900/50 text-blue-400 border border-blue-700'
        : 'px-3 py-1 rounded text-xs font-medium bg-slate-700 text-slate-400 border border-slate-600';
    document.getElementById('tab-web').className = tab === 'web'
        ? 'px-3 py-1 rounded text-xs font-medium bg-blue-900/50 text-blue-400 border border-blue-700'
        : 'px-3 py-1 rounded text-xs font-medium bg-slate-700 text-slate-400 border border-slate-600';
    loadLogs();
}

async function loadLogs() {
    const lines = document.getElementById('log-lines').value;
    const pre = document.getElementById('log-content');
    const meta = document.getElementById('log-meta');

    try {
        const resp = await fetch(`/api/debug/logs/${activeLogTab}?lines=${lines}`);
        const data = await resp.json();

        if (!data.file_exists) {
            pre.textContent = `Log file not found: ${activeLogTab}.log`;
            meta.textContent = '';
            return;
        }

        meta.textContent = `${data.lines_returned} lines | ${fmtBytes(data.file_size_bytes)} | modified ${fmtRelative(data.last_modified)}`;

        if (data.content.length === 0) {
            pre.textContent = '(empty)';
        } else {
            pre.textContent = data.content.join('\n');
            // Auto-scroll to bottom
            pre.scrollTop = pre.scrollHeight;
        }
    } catch (e) {
        pre.textContent = 'Error loading logs: ' + e.message;
        meta.textContent = '';
    }
}

// ── PROGRESS ─────────────────────────────────────────────────────────────
async function loadProgress() {
    const container = document.getElementById('progress-content');
    try {
        const resp = await fetch('/api/debug/progress');
        const data = await resp.json();

        if (!data.repos || data.repos.length === 0) {
            container.innerHTML = '<p class="text-slate-500">No repositories found.</p>';
            return;
        }

        // Update snapshot history for each repo
        const now = Date.now();
        for (const repo of data.repos) {
            if (!progressHistory[repo.name]) progressHistory[repo.name] = [];
            const h = progressHistory[repo.name];
            h.push({
                ts: now,
                chunks_embedded: repo.chunks_embedded,
                docs_embedded: repo.docs_embedded,
                file_summaries: repo.file_summaries,
                symbol_summaries: repo.symbol_summaries,
            });
            if (h.length > MAX_HISTORY) h.splice(0, h.length - MAX_HISTORY);
        }

        let html = '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">';

        for (const repo of data.repos) {
            const h = progressHistory[repo.name] || [];

            const metrics = [
                { label: 'Chunk Embeddings', current: repo.chunks_embedded, total: repo.chunks_total, key: 'chunks_embedded', color: 'blue' },
                { label: 'Doc Embeddings',   current: repo.docs_embedded,   total: repo.docs_total,   key: 'docs_embedded',   color: 'emerald' },
                { label: 'File Summaries',   current: repo.file_summaries,  total: repo.files_total,  key: 'file_summaries',  color: 'purple' },
                { label: 'Symbol Summaries', current: repo.symbol_summaries, total: repo.symbols_total, key: 'symbol_summaries', color: 'amber' },
            ];

            html += `
            <div class="bg-slate-900 border border-slate-700 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-slate-100 mb-3">${repo.name}</h4>
                <div class="space-y-3">`;

            for (const m of metrics) {
                const p = pct(m.current, m.total);
                const rate = calcRate(h, m.key);
                const eta = calcEta(m.current, m.total, rate);
                const rateStr = rate > 0 ? rate.toFixed(1) + '/min' : '--';

                const barColors = {
                    blue: 'bg-blue-500',
                    emerald: 'bg-emerald-500',
                    purple: 'bg-purple-500',
                    amber: 'bg-amber-500',
                };

                html += `
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">${m.label}</span>
                            <span class="text-slate-300">${fmt(m.current)} / ${fmt(m.total)} (${fmtPct(m.current, m.total)})</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-2">
                            <div class="${barColors[m.color]} h-2 rounded-full transition-all duration-500" style="width: ${p}%"></div>
                        </div>
                        <div class="flex justify-between text-xs mt-0.5">
                            <span class="text-slate-500">Rate: ${rateStr}</span>
                            <span class="text-slate-500">ETA: ${eta}</span>
                        </div>
                    </div>`;
            }

            html += '</div></div>';
        }

        html += '</div>';
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = `<p class="text-red-400">Error: ${e.message}</p>`;
    }
}

// ── JOBS ─────────────────────────────────────────────────────────────────
async function loadJobs() {
    const badges = document.getElementById('jobs-badges');
    const content = document.getElementById('jobs-content');

    try {
        const resp = await fetch('/api/stats/jobs');
        const data = await resp.json();

        if (!data.enabled) {
            badges.innerHTML = '<span class="text-xs text-slate-500">Job queue not configured</span>';
            content.innerHTML = '';
            return;
        }

        // Badges
        badges.innerHTML = `
            <span class="px-2 py-1 rounded text-xs bg-yellow-900/50 text-yellow-400 border border-yellow-700">
                Pending: ${data.pending}
            </span>
            <span class="px-2 py-1 rounded text-xs bg-blue-900/50 text-blue-400 border border-blue-700">
                Running: ${data.claimed}
            </span>
            <span class="px-2 py-1 rounded text-xs bg-emerald-900/50 text-emerald-400 border border-emerald-700">
                Done: ${data.done}
            </span>
            <span class="px-2 py-1 rounded text-xs ${data.failed > 0 ? 'bg-red-900/50 text-red-400 border border-red-700' : 'bg-slate-700 text-slate-400 border border-slate-600'}">
                Failed: ${data.failed}
            </span>
        `;

        let html = '';

        // Running jobs
        if (data.running_jobs && data.running_jobs.length > 0) {
            html += `
            <h4 class="font-semibold text-slate-300 text-sm mb-2">Running</h4>
            <div class="overflow-x-auto mb-4">
                <table class="min-w-full text-xs">
                    <thead class="bg-slate-700">
                        <tr>
                            <th class="px-3 py-2 text-left text-slate-300">ID</th>
                            <th class="px-3 py-2 text-left text-slate-300">Repo</th>
                            <th class="px-3 py-2 text-left text-slate-300">Type</th>
                            <th class="px-3 py-2 text-left text-slate-300">Worker</th>
                            <th class="px-3 py-2 text-left text-slate-300">Started</th>
                            <th class="px-3 py-2 text-right text-slate-300">Attempts</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                        ${data.running_jobs.map(j => `
                        <tr class="hover:bg-slate-700/50">
                            <td class="px-3 py-2 font-mono text-slate-400">${j.id.slice(0, 8)}</td>
                            <td class="px-3 py-2 text-slate-100">${j.repo}</td>
                            <td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-blue-900/50 text-blue-400 border border-blue-700">${j.job_type}</span></td>
                            <td class="px-3 py-2 text-slate-400 font-mono">${j.worker || '-'}</td>
                            <td class="px-3 py-2 text-slate-400">${fmtRelative(j.claimed_at)}</td>
                            <td class="px-3 py-2 text-right text-slate-300">${j.attempts}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        }

        // Pending jobs
        if (data.pending_jobs && data.pending_jobs.length > 0) {
            html += `
            <h4 class="font-semibold text-slate-300 text-sm mb-2">Pending</h4>
            <div class="overflow-x-auto mb-4">
                <table class="min-w-full text-xs">
                    <thead class="bg-slate-700">
                        <tr>
                            <th class="px-3 py-2 text-left text-slate-300">ID</th>
                            <th class="px-3 py-2 text-left text-slate-300">Repo</th>
                            <th class="px-3 py-2 text-left text-slate-300">Type</th>
                            <th class="px-3 py-2 text-right text-slate-300">Priority</th>
                            <th class="px-3 py-2 text-left text-slate-300">Created</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                        ${data.pending_jobs.map(j => `
                        <tr class="hover:bg-slate-700/50">
                            <td class="px-3 py-2 font-mono text-slate-400">${j.id.slice(0, 8)}</td>
                            <td class="px-3 py-2 text-slate-100">${j.repo}</td>
                            <td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-yellow-900/50 text-yellow-400 border border-yellow-700">${j.job_type}</span></td>
                            <td class="px-3 py-2 text-right text-slate-300">${j.priority}</td>
                            <td class="px-3 py-2 text-slate-400">${fmtRelative(j.created_at)}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        }

        // Recent failures
        if (data.recent_failures && data.recent_failures.length > 0) {
            html += `
            <h4 class="font-semibold text-red-400 text-sm mb-2">Recent Failures</h4>
            <div class="overflow-x-auto">
                <table class="min-w-full text-xs">
                    <thead class="bg-slate-700">
                        <tr>
                            <th class="px-3 py-2 text-left text-slate-300">ID</th>
                            <th class="px-3 py-2 text-left text-slate-300">Repo</th>
                            <th class="px-3 py-2 text-left text-slate-300">Type</th>
                            <th class="px-3 py-2 text-left text-slate-300">Error</th>
                            <th class="px-3 py-2 text-left text-slate-300">When</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                        ${data.recent_failures.map(j => `
                        <tr class="hover:bg-slate-700/50">
                            <td class="px-3 py-2 font-mono text-slate-400">${j.id.slice(0, 8)}</td>
                            <td class="px-3 py-2 text-slate-100">${j.repo}</td>
                            <td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-red-900/50 text-red-400 border border-red-700">${j.job_type}</span></td>
                            <td class="px-3 py-2 text-red-300 max-w-xs truncate" title="${(j.error || '').replace(/"/g, '&quot;')}">${j.error || '-'}</td>
                            <td class="px-3 py-2 text-slate-400">${fmtRelative(j.created_at)}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        }

        if (!html) {
            html = '<p class="text-slate-500 text-sm">No active or recent jobs.</p>';
        }

        content.innerHTML = html;
    } catch (e) {
        badges.innerHTML = `<span class="text-xs text-red-400">Error: ${e.message}</span>`;
        content.innerHTML = '';
    }
}
</script>
{% endblock %}
