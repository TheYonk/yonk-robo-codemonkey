# suites/tier3_discover/flask-configuration.yaml
id: discover-flask-configuration
name: "Discover Flask's configuration system"
difficulty: medium
category: discover
task_type: qa
target_repo: flask

prompt: |
  Find and explain how Flask handles configuration. Your analysis should
  trace the implementation through the actual source code.

  Specifically:

  1. Identify the Config class. What file is it defined in? What does it
     inherit from? How does it relate to a standard Python dict?
  2. Explain how default configuration values are established. Where are
     Flask's built-in defaults defined, and how are they loaded into the
     Config object at app creation time?
  3. Walk through the from_object() method. How does it import and extract
     configuration from a Python object or module path string?
  4. Walk through the from_envvar() method. How does it read an environment
     variable to locate a configuration file? What happens if the variable
     is not set?
  5. Explain from_file() and from_mapping(). How do these alternative
     loading methods work?
  6. How does the app.config attribute get created and populated during
     Flask app initialization?

  Cite specific file paths, class names, and method signatures. Do not
  describe behavior that is not supported by code in the repository.

setup:
  commit: "main"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  llm_judge: true
  hallucination_check: true
  rubric:
    - "Identifies the Config class file and its dict-based inheritance"
    - "Explains how default configuration values are established"
    - "Walks through from_object method with import mechanism"
    - "Explains from_envvar and from_file loading methods"
    - "Describes Config creation during Flask app initialization"
  rubric_weights:
    "Identifies the Config class file and its dict-based inheritance": 0.15
    "Explains how default configuration values are established": 0.20
    "Walks through from_object method with import mechanism": 0.25
    "Explains from_envvar and from_file loading methods": 0.20
    "Describes Config creation during Flask app initialization": 0.20
  min_detail_level: "moderate"
  factual_grounding: true

tags: [discovery, configuration, flask, settings, initialization]
expected_turns_range: [2, 10]
