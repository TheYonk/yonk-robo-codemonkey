# suites/tier3_discover/flask-request-hooks.yaml
id: discover-flask-request-hooks
name: "Discover Flask's request lifecycle hooks"
difficulty: medium
category: discover
task_type: qa
target_repo: flask

prompt: |
  Find and explain Flask's request lifecycle hooks (before_request,
  after_request, teardown_request, teardown_appcontext). Your analysis
  should be grounded in the actual source code.

  Specifically:

  1. Identify the files and classes where these hooks are defined and
     stored. Where are the decorator methods implemented? What data
     structures hold the registered callbacks?
  2. Trace the request processing flow. In what order are before_request,
     after_request, and teardown handlers invoked during a normal request?
     What happens when a before_request handler returns a response early?
  3. Explain how blueprint-level hooks interact with app-level hooks.
     What is the execution order when both exist?
  4. Describe the teardown mechanism. How do teardown_request and
     teardown_appcontext differ? When are they called, and what
     guarantees do they provide (e.g., are they called on exceptions)?
  5. How does the error handling path interact with these hooks?
     What happens to after_request handlers when an exception occurs?

  Cite specific file paths, class names, and method signatures from the
  repository. Do not invent code that is not present.

setup:
  commit: "main"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  llm_judge: true
  hallucination_check: true
  rubric:
    - "Identifies files and classes where hooks are defined (scaffold, app)"
    - "Explains request processing order for before/after/teardown"
    - "Describes blueprint-level vs app-level hook interaction and ordering"
    - "Explains teardown_request vs teardown_appcontext differences"
    - "Covers error handling interaction with hooks"
  rubric_weights:
    "Identifies files and classes where hooks are defined (scaffold, app)": 0.15
    "Explains request processing order for before/after/teardown": 0.25
    "Describes blueprint-level vs app-level hook interaction and ordering": 0.25
    "Explains teardown_request vs teardown_appcontext differences": 0.20
    "Covers error handling interaction with hooks": 0.15
  min_detail_level: "moderate"
  factual_grounding: true

tags: [discovery, request-lifecycle, flask, middleware, hooks]
expected_turns_range: [2, 10]
