# suites/tier3_discover/flask-blueprints.yaml
id: discover-flask-blueprints
name: "Discover Flask's Blueprint system"
difficulty: medium
category: discover
task_type: qa
target_repo: flask

prompt: |
  Find and explain how Flask's Blueprint system works. Your investigation
  should cover the full implementation across the source tree.

  Specifically:

  1. Identify all files that implement or contribute to the Blueprint system.
     Include the WSGI-layer class, the sans-I/O base class, and any scaffold
     or mixin base classes.
  2. Explain how blueprints are registered on a Flask application. Walk
     through the register() method and describe what happens at registration
     time versus at request dispatch time.
  3. Explain how URL routing works with blueprints. How are URL prefixes
     applied? How does url_for() resolve blueprint endpoints?
  4. Describe how nested blueprints work (registering a blueprint on another
     blueprint). What limitations or behaviors arise from nesting?
  5. How are blueprint-scoped static files and templates resolved?

  Cite specific file paths, class names, and method names from the source.
  Do not speculate about code that does not exist in the repository.

setup:
  commit: "main"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  llm_judge: true
  hallucination_check: true
  rubric:
    - "Identifies core Blueprint files (blueprints.py, sansio/blueprints.py, sansio/scaffold.py)"
    - "Explains registration flow (register method, deferred actions)"
    - "Explains URL routing with prefixes and url_for endpoint resolution"
    - "Describes nested blueprint support and behavior"
    - "Covers static file and template resolution for blueprints"
  rubric_weights:
    "Identifies core Blueprint files (blueprints.py, sansio/blueprints.py, sansio/scaffold.py)": 0.20
    "Explains registration flow (register method, deferred actions)": 0.25
    "Explains URL routing with prefixes and url_for endpoint resolution": 0.25
    "Describes nested blueprint support and behavior": 0.15
    "Covers static file and template resolution for blueprints": 0.15
  min_detail_level: "moderate"
  factual_grounding: true

tags: [discovery, blueprints, flask, architecture, routing]
expected_turns_range: [2, 10]
