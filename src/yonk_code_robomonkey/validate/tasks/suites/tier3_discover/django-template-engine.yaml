# suites/tier3_discover/django-template-engine.yaml
id: discover-django-template-engine
name: "Discover Django's template engine"
difficulty: medium
category: discover
task_type: qa
target_repo: django

prompt: |
  Find and explain Django's template engine. Your analysis should trace
  through the actual source code in the repository.

  Specifically:

  1. Identify the core files that implement the template engine. Where are
     the Template, Engine, Lexer, Parser, and NodeList classes defined?
  2. Explain how templates are loaded. What is the template loader system?
     How does Django find template files on disk? Describe the loader
     classes and the TEMPLATES configuration.
  3. Trace the compilation pipeline. When a template string is compiled,
     how does the Lexer tokenize it, the Parser build a node tree, and
     the nodes get organized into a NodeList?
  4. Explain how templates are rendered. Walk through the render() method.
     How does the Context object work? How do template variables get
     resolved?
  5. How are template tags and filters implemented? Where is the built-in
     tag/filter library defined? How does the {% load %} tag work?
  6. How does template inheritance work ({% extends %} and {% block %})?
     What classes implement this and how is the block override mechanism
     handled?

  Cite specific file paths, class names, and method signatures from the
  repository. Do not describe internals that are not present in the code.

setup:
  commit: "main"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  llm_judge: true
  hallucination_check: true
  rubric:
    - "Identifies core template engine files (Template, Engine, Lexer, Parser)"
    - "Explains template loading and the loader system"
    - "Traces compilation pipeline from tokenization to node tree"
    - "Describes rendering with Context and variable resolution"
    - "Covers template tags, filters, and the load mechanism"
    - "Explains template inheritance (extends, block) implementation"
  rubric_weights:
    "Identifies core template engine files (Template, Engine, Lexer, Parser)": 0.10
    "Explains template loading and the loader system": 0.15
    "Traces compilation pipeline from tokenization to node tree": 0.20
    "Describes rendering with Context and variable resolution": 0.20
    "Covers template tags, filters, and the load mechanism": 0.15
    "Explains template inheritance (extends, block) implementation": 0.20
  min_detail_level: "moderate"
  factual_grounding: true

tags: [discovery, templates, django, rendering, compilation]
expected_turns_range: [2, 10]
