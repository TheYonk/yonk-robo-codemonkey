# suites/tier3_discover/fastapi-dependency-injection.yaml
id: discover-fastapi-dependency-injection
name: "Discover FastAPI's dependency injection system"
difficulty: medium
category: discover
task_type: qa
target_repo: fastapi

prompt: |
  Find and explain FastAPI's dependency injection system. Your investigation
  should trace through the actual source code in the repository.

  Specifically:

  1. Identify all files that implement the dependency injection system.
     Where is the Depends() function defined? What class or structure
     does it return?
  2. Explain how dependencies are resolved at request time. Trace the
     dependency resolution chain from route handler declaration through
     to actual invocation. How does FastAPI build and traverse the
     dependency graph?
  3. How are sub-dependencies handled? If Depends(A) and A itself
     depends on Depends(B), how is the resolution order determined?
  4. Explain the use_cache parameter on Depends(). How does caching
     work within a single request? What data structure stores resolved
     dependencies?
  5. How are generator/async generator dependencies (yield dependencies)
     handled? Where is the cleanup logic for these dependencies?
  6. How does dependency injection interact with FastAPI's request
     validation (Pydantic models, query params, etc.)?

  Cite specific file paths, class names, and function signatures from the
  source code. Do not speculate about internals that are not visible in
  the repository.

setup:
  commit: "master"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  llm_judge: true
  hallucination_check: true
  rubric:
    - "Identifies Depends() definition and core DI files"
    - "Explains dependency resolution chain at request time"
    - "Describes sub-dependency handling and resolution order"
    - "Explains use_cache parameter and per-request caching"
    - "Covers yield-based dependencies and cleanup logic"
  rubric_weights:
    "Identifies Depends() definition and core DI files": 0.15
    "Explains dependency resolution chain at request time": 0.25
    "Describes sub-dependency handling and resolution order": 0.20
    "Explains use_cache parameter and per-request caching": 0.20
    "Covers yield-based dependencies and cleanup logic": 0.20
  min_detail_level: "moderate"
  factual_grounding: true

tags: [discovery, dependency-injection, fastapi, depends, architecture]
expected_turns_range: [2, 10]
