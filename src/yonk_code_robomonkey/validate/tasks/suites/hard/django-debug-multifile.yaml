# suites/hard/django-debug-multifile.yaml
id: hard-django-debug-multifile
name: "Debug a migration issue spanning models, forms, and admin"
difficulty: hard
category: fix
target_repo: django

prompt: |
  There is a complex issue in Django where adding a `UniqueConstraint` with
  `condition` (a partial unique constraint) on a model that is also registered
  in the admin with inline formsets can cause validation errors during admin
  form submission. The issue spans multiple files.

  The problem manifests as follows:
  - A model has `Meta.constraints` with a `UniqueConstraint` that includes
    a `condition=Q(active=True)` parameter.
  - When editing objects in the Django admin with inline formsets, the
    `validate_unique()` method on the model form does not account for the
    `condition` in the constraint, causing spurious validation errors.

  Investigate and fix the following files:

  1. `django/forms/models.py`:
     - In `BaseModelForm.validate_unique()`, examine how it calls
       `instance.validate_unique()`. The form-level validation should
       be aware of conditional constraints and not raise errors when
       the condition is not met.
     - Fix the `_validate_unique` logic to pass `exclude` correctly
       when conditional constraints are involved.

  2. `django/db/models/base.py`:
     - In `Model.validate_unique()`, examine how `UniqueConstraint`
       objects with `condition` are validated. The method should skip
       validation for constraints whose condition does not match the
       current instance's field values.
     - Fix the constraint validation loop to evaluate the `condition`
       Q object against the current instance before checking uniqueness.

  3. `django/contrib/admin/options.py`:
     - In `InlineModelAdmin._construct_form()` or related methods,
       examine how inline forms are constructed and validated. Ensure
       that conditional unique constraints do not cause false positives
       during inline form validation.

  4. `django/db/models/constraints.py`:
     - In `UniqueConstraint.validate()`, ensure the `condition` is
       properly evaluated against the model instance. Add a helper
       method `_check_condition(instance)` that evaluates the Q object
       condition against the instance's field values.

  5. `django/forms/formsets.py`:
     - In `BaseInlineFormSet.validate_unique()`, ensure that conditional
       constraints are handled correctly when comparing across forms
       in the formset.

  Add clear comments explaining the fix and the interaction between the
  constraint condition, form validation, and admin inline formsets.

setup:
  commit: "5.0"
  branch: "validate/baseline"

eval:
  tests: []
  lint: true
  type_check: false
  max_files_changed: 5
  must_modify:
    - "django/forms/models.py"
    - "django/db/models/base.py"
    - "django/db/models/constraints.py"
  must_not_modify: []
  hallucination_check: true
  llm_judge: true

tags: [fix, hard, django, migration, forms, admin, constraints, multifile]
expected_turns_range: [10, 30]
