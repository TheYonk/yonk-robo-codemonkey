# suites/tier2_review/sample-review-routing.yaml
id: review-sample-routing
name: "Review RoboMonkey routing and URL dispatching patterns"
difficulty: medium
category: review
task_type: qa
target_repo: sample

prompt: |
  Review the routing and URL dispatching system in this project. Examine the
  web UI routes in `src/yonk_code_robomonkey/web/routes/` (repos.py, docs.py,
  settings.py, stats.py, maintenance.py), the MCP tool dispatch in
  `src/yonk_code_robomonkey/mcp/tools.py`, and the CLI command structure in
  `src/yonk_code_robomonkey/cli/`.

  In your review, please address the following:

  1. What routing mechanisms are used? How does the FastAPI web UI register
     routes, and how does the MCP server dispatch tool calls?
  2. List all the route/endpoint registration patterns found -- FastAPI
     router decorators, APIRouter includes, MCP tool registration, CLI
     command groups, etc.
  3. How are the web routes organized across modules? Is there a consistent
     pattern for URL prefixes, response models, and error responses?
  4. Identify any inconsistencies across the routing layers -- for example,
     naming convention mismatches between web API endpoints and MCP tools,
     missing endpoints, or inconsistent URL prefix patterns.
  5. Suggest concrete improvements to make the routing more consistent and
     maintainable, with references to specific files and functions.

  Reference actual source files and line ranges in your analysis.

setup:
  commit: "main"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  hallucination_check: true
  llm_judge: true
  rubric:
    - "identifies routing mechanism"
    - "lists route registration patterns"
    - "notes inconsistencies"
    - "suggests improvements"
    - "references actual files"
  rubric_weights:
    "identifies routing mechanism": 0.25
    "lists route registration patterns": 0.25
    "notes inconsistencies": 0.20
    "suggests improvements": 0.15
    "references actual files": 0.15
  min_detail_level: "moderate"
  factual_grounding: true

tags: ["review", "routing", "sample", "url-dispatch", "tier2"]
expected_turns_range: [2, 8]
