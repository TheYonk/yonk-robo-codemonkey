# suites/tier2_review/fastapi-review-error-handling.yaml
id: review-fastapi-error-handling
name: "Review FastAPI error and exception handling patterns"
difficulty: medium
category: review
task_type: qa
target_repo: fastapi

prompt: |
  Review how errors and exceptions are handled across the FastAPI project.
  Examine the source code in `fastapi/` with particular attention to
  `exception_handlers.py`, `exceptions.py`, `routing.py`, and the
  relationship with Starlette's exception handling.

  In your review, please address the following:

  1. What are the primary error handling patterns in FastAPI? How do
     `HTTPException`, `RequestValidationError`, and `WebSocketException`
     relate to each other and to Starlette's exception classes?
  2. How does the exception handler registration work? Trace the path from
     a raised exception in an endpoint to the JSON error response returned
     to the client.
  3. How does Pydantic validation error handling integrate with FastAPI's
     exception system? What happens when request body validation fails?
  4. Are there gaps or missing error handlers? Are there scenarios where
     exceptions could produce unhelpful responses or leak internal details?
  5. How is logging used in error paths? Are errors consistently logged
     with useful context?

  Reference actual source files and code locations in your analysis.

setup:
  commit: "master"
  branch: "validate/baseline"

eval:
  tests: []
  lint: false
  type_check: false
  max_files_changed: 0
  must_modify: []
  must_not_modify: []
  hallucination_check: true
  llm_judge: true
  rubric:
    - "identifies error handling patterns"
    - "finds gaps or missing handlers"
    - "notes logging practices"
    - "references actual code locations"
  rubric_weights:
    "identifies error handling patterns": 0.30
    "finds gaps or missing handlers": 0.25
    "notes logging practices": 0.20
    "references actual code locations": 0.25
  min_detail_level: "moderate"
  factual_grounding: true

tags: ["review", "error-handling", "fastapi", "exceptions", "tier2"]
expected_turns_range: [2, 8]
